name: Deploy Application

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: Staging

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull validated Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/devops-case-study:${{ github.event.workflow_run.head_sha }}

      - name: Deploy staging container
        run: |
          docker run -d \
            --name staging-app \
            -p 3000:3000 \
            ghcr.io/${{ github.repository_owner }}/devops-case-study:${{ github.event.workflow_run.head_sha }}

      - name: Verify staging deployment
        run: |
          sleep 3
          curl --fail http://localhost:3000/health

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull validated Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/devops-case-study:${{ github.event.workflow_run.head_sha }}

      - name: Deploy production container
        run: |
          docker run -d \
            --name production-app \
            -p 3000:3000 \
            ghcr.io/${{ github.repository_owner }}/devops-case-study:${{ github.event.workflow_run.head_sha }}

      - name: Verify production deployment
        run: |
          sleep 3
          curl --fail http://localhost:3000/health