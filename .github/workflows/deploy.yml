name: Deploy Application

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: Staging

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull validated Docker image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/devops-case-study:${{ github.event.workflow_run.head_sha }}

      - name: Deploy staging container
        run: |
          docker run -d \
            --name staging-app \
            -p 3000:3000 \
            ghcr.io/${{ github.repository_owner }}/devops-case-study:${{ github.event.workflow_run.head_sha }}

      - name: Verify staging deployment
        run: |
          echo "Waiting for staging application to become ready..."

          for attempt in {1..10}; do
            echo "Health-check attempt ${attempt}/10"

            if curl --fail --silent --show-error http://127.0.0.1:3000/health; then
              echo
              echo "Staging deployment is healthy."
              exit 0
            fi

            echo "Application not ready yet."
            docker ps -a
            docker logs staging-app || true
            sleep 2
          done

          echo "Staging deployment failed health verification."
          docker ps -a
          docker logs staging-app || true
          exit 1

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull validated Docker image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/devops-case-study:${{ github.event.workflow_run.head_sha }}

      - name: Deploy production container
        run: |
          docker run -d \
            --name production-app \
            -p 3000:3000 \
            ghcr.io/${{ github.repository_owner }}/devops-case-study:${{ github.event.workflow_run.head_sha }}

      - name: Verify production deployment
        run: |
          echo "Waiting for production application to become ready..."

          for attempt in {1..10}; do
            echo "Health-check attempt ${attempt}/10"

            if curl --fail --silent --show-error http://127.0.0.1:3000/health; then
              echo
              echo "Production deployment is healthy."
              exit 0
            fi

            echo "Application not ready yet."
            docker ps -a
            docker logs production-app || true
            sleep 2
          done

          echo "Production deployment failed health verification."
          docker ps -a
          docker logs production-app || true
          exit 1