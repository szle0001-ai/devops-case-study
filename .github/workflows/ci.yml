name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      permissions:
  contents: read
  packages: write

jobs:
  quality-check:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source code
        run: npm run lint

      - name: Run automated tests
        run: npm test
              - name: Build Docker image
        run: docker build -t devops-case-study:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image for registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag devops-case-study:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/devops-case-study:${{ github.sha }}

      - name: Push Docker image to registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository_owner }}/devops-case-study:${{ github.sha }}

        
